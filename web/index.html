<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
		<!-- Installable on phones: Add to Home Screen opens it full screen with its own icon. -->
		<link rel="manifest" href="/manifest.webmanifest?v=2" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Sprig" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- The nav bar's color: the strip behind the phone's clock and battery joins up with it (lib/useTheme.ts sets it for dark). -->
		<meta name="theme-color" content="#ffffff" />
		<title>Sprig</title>
		<!-- Dark before the first paint, when picked or the device is dark (lib/useTheme.ts takes over;
		     kid mode turns it light again), and the device's accent. -->
		<script>
			try {
				var t = localStorage.getItem("sprig:theme");
				var kid = localStorage.getItem("sprig:kid-mode");
				if (!kid && (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))) {
					document.documentElement.dataset.theme = "dark";
					document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1e2024");
				}
				// This device's accent (lib/accent.ts), so the page doesn't flash Sprig green first.
				var accent = localStorage.getItem("sprig:accent-css");
				if (accent) {
					var style = document.createElement("style");
					style.id = "sprig-accent";
					style.textContent = accent;
					document.head.appendChild(style);
				}
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
