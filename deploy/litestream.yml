# Continuous backups: every database in the data folder (accounts.db, and each household's
# calendar.db, including ones added later) is copied to the storage bucket as it changes.
# The bucket's settings come from `fly storage create` (BUCKET_NAME, AWS_ENDPOINT_URL_S3, and the keys).
dbs:
  - dir: ${DATA_DIR}
    pattern: "*.db"
    recursive: true
    watch: true
    replica:
      type: s3
      bucket: ${BUCKET_NAME}
      path: backups
      endpoint: ${AWS_ENDPOINT_URL_S3}
      region: auto
