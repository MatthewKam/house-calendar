# Fly.io: one small always-on server with a disk (the volume) for the data. See README "Hosting".
# `app` and `primary_region` are filled in by `fly launch`.
app = "household"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATA_DIR = "/data"
  # Fly's proxy terminates HTTPS and says who's connecting.
  TRUST_PROXY = "1"

# The disk: databases, photos and videos. Fly also snapshots it daily, kept 14 days.
[[mounts]]
  source = "household_data"
  destination = "/data"
  snapshot_retention = 14

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: calendars sync and "time to leave" alerts run in the background.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# 1 GB: enough for the app plus converting an uploaded video.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
